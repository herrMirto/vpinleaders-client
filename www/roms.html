<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supported ROMs — VPinScore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
      --accent: #0969da;
      --green: #1a7f37;
      --code-bg: #f6f8fa;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: 16px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo svg { color: var(--accent); }

    nav { display: flex; gap: 20px; margin-left: auto; }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s;
    }

    nav a:hover, nav a.active { color: var(--text); }

    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 36px 24px 28px;
    }

    .page-header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 9px 12px 9px 38px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="search"]:focus { border-color: var(--accent); }
    input[type="search"]::placeholder { color: var(--muted); }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .stat-chip span { color: var(--accent); font-weight: 600; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      position: sticky;
      top: 49px;
      z-index: 10;
    }

    thead th:first-child { border-radius: 6px 0 0 0; width: 55%; }
    thead th:last-child { border-radius: 0 6px 0 0; width: 45%; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:hover { background: rgba(0,0,0,0.03); }

    tbody td {
      padding: 10px 14px;
      vertical-align: middle;
    }

    tbody td:first-child { color: var(--text); }

    tbody td:last-child {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .no-results {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      display: none;
    }

    .no-results svg { margin: 0 auto 12px; display: block; opacity: 0.4; }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <line x1="19" y1="12" x2="22" y2="12"/>
      </svg>
      VPinScore
    </a>
    <nav>
      <a href="index.html">Docs</a>
      <a href="roms.html" class="active">Supported ROMs</a>
    </nav>
  </div>
</header>

<div class="page-header">
  <div class="page-header-inner">
    <h1>Supported ROMs</h1>
    <p>All pinball ROMs with NVRAM maps — scores are read directly from PinMAME memory for these titles.</p>
  </div>
</div>

<main>
  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="search" placeholder="Search by game name or ROM ID…" autocomplete="off" />
    </div>
    <div class="stat-chip">Showing <span id="count">897</span> of <span id="total">897</span> ROMs</div>
  </div>

  <table id="rom-table">
    <thead>
      <tr>
        <th>Game Name</th>
        <th>ROM ID</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="no-results" id="no-results">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <p>No ROMs match your search.</p>
  </div>
</main>

<footer>
  VPinScore &mdash; open source score tracker for Visual Pinball X
</footer>

const tbody = document.getElementById('tbody');
const countEl = document.getElementById('count');
const totalEl = document.getElementById('total');
const noResults = document.getElementById('no-results');
const searchEl = document.getElementById('search');
const table = document.getElementById('rom-table');

totalEl.textContent = ROMS.length;

function render(list) {
  tbody.innerHTML = list.map(r =>
    `<tr><td>${r.name}</td><td>${r.id}</td></tr>`
  ).join('');
  countEl.textContent = list.length;
  noResults.style.display = list.length === 0 ? 'block' : 'none';
  table.style.display = list.length === 0 ? 'none' : '';
}

render(ROMS);

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { render(ROMS); return; }
  render(ROMS.filter(r =>
    r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q)
  ));
});
</script>
