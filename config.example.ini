[vpinleaders]
; Set to true to send scores to vpinleaders.com on every manual send trigger.
enable = false
api_key =
machine_id =

[wovp]
; Set to true to send scores to WoVP on every manual send trigger.
enable = false
api_key =
selected_challenge_id =
selected_challenge_name =

[iscored]
; Set to true to send scores to iScored on every manual send trigger.
enable = false
; iScored username. This is also the API gameroom: /api/{player_name}.
player_name =
; API access must be enabled in that iScored user's gameroom settings.
; Game lookup is automatic: when a score is sent, the client searches that
; gameroom for a game whose name matches the VPX file / ROM and submits there.
; The full game list is shown in the tray under iScored ▸ Games at app startup
; so you can verify what iScored has.
selected_gameroom =
selected_game_id =
selected_game_name =

[screenshot]
; Index of the monitor to capture (0 = primary). Screenshots are always taken
; for VPinLeaders and WoVP submissions; this only controls which display is
; captured.
screen_to_capture = 0

[hotkeys]
keyboard = cmd+shift+s
joystick_buttons =

[nvram]
base_dir = /path/to/your/nvram-base-dir
# Windows
#base_dir = C:\path\to\your\nvram-base-dir

[logging]
file = ~/.vpinleaders/logs/vpinleaders.log
