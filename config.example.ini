[vpinleaders]
; Set to true to send scores to vpinleaders.com on every manual send trigger.
enable = false
api_key =
machine_id =

[wovp]
; Set to true to send scores to WoVP on every manual send trigger.
enable = false
api_key =
selected_challenge_id =
selected_challenge_name =

[iscored]
; Set to true to send scores to iScored on every manual send trigger.
enable = false
; iScored username.
player_name =
; Your iScored gameroom must allow score submissions.
; Game lookup is automatic: when a score is sent, the client searches for a
; game whose name matches the VPX file / ROM and submits there.
; The full game list is shown in the tray under iScored ▸ Games at app startup
; so you can verify what iScored has.
selected_gameroom =
selected_game_id =
selected_game_name =

[vpinplay]
; Set to true to sync scores to your own local/network VPinPlay instance.
enable = false
api_url = http://localhost:8888
user_id =
initials =
machine_id =

[screenshot]
; Index of the monitor to capture (0 = primary). Screenshots are always taken
; for VPinLeaders and WoVP submissions; this only controls which display is
; captured.
screen_to_capture = 0

[hotkeys]
keyboard = cmd+shift+s
joystick_buttons =

[nvram]
; Tables folder following the VPX 10.8.1 File Layout:
; https://github.com/vpinball/vpinball/blob/master/docs/FileLayout.md
base_dir = /path/to/your/tables-folder
# Windows
#base_dir = C:\path\to\your\tables-folder

[logging]
file = ~/.vpinleaders/logs/vpinleaders.log
