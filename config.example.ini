[integration]
; Which integration is active: vpinleaders | wovp | iscored
active = vpinleaders

[vpinleaders]
api_url = https://www.vpinleaders.com
api_key =
machine_id =
; How scores are sent: automatic | manual
send_mode = automatic

[wovp]
api_key =
selected_challenge_id =
selected_challenge_name =

[iscored]
; Player name used when submitting scores to iScored.
player_name =
; One or more iScored room URLs. Separate multiple URLs with commas or new lines.
; Each URL must include the user component, either as a path (.../UserName) or
; as a query parameter (...?user=UserName).
; Example: https://www.iscored.info/Andre, https://www.iscored.info/Foo?room=bar
; API access must be enabled in that iScored gameroom's settings.
; You can also provide gameroom names directly instead of URLs:
; gamerooms = Andre
;
; Game lookup is automatic: when a score is sent, the client searches every
; configured room for a game whose name matches the VPX file / ROM and submits
; to whichever room owns it. The full game list is shown in the tray under
; iScored ▸ Games at app startup so you can verify what iScored has.
room_urls =
gamerooms =

[screenshot]
enable = false
; Index of the monitor to capture (0 = primary)
screen_to_capture = 0

[hotkeys]
keyboard = cmd+shift+s
joystick_buttons =

[nvram]
base_dir = /path/to/your/nvram-base-dir
# Windows
#base_dir = C:\path\to\your\nvram-base-dir

[logging]
file = ~/.vpinleaders/logs/vpinleaders.log
