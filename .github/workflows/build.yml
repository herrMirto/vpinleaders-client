name: Build VPinScore

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "www/**"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux desktop bundle
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name VPinScore-Linux-x64 \
            --add-data "assets:assets" \
            --add-data "config.example.ini:." \
            --add-data "nvram-maps:nvram-maps" \
            --hidden-import="pynput.keyboard._xorg" \
            --hidden-import="pynput.mouse._xorg" \
            main.py
          cp linux/vpinscore-start.sh dist/vpinscore-start.sh
          chmod +x dist/vpinscore-start.sh
          cd dist
          zip -qry VPinScore-Linux-x64.zip VPinScore-Linux-x64 vpinscore-start.sh

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPinScore-Linux-x64.zip
          path: dist/VPinScore-Linux-x64.zip
          archive: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --add-data "assets;assets" --add-data "config.example.ini;." --add-data "nvram-maps;nvram-maps" --icon "assets/icon.ico" --hidden-import="pynput.keyboard._win32" --hidden-import="pynput.mouse._win32" --name "VPinScore-Windows-x64" main.py
          Compress-Archive -Path dist/VPinScore-Windows-x64.exe -DestinationPath dist/VPinScore-Windows-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPinScore-Windows-x64.zip
          path: dist/VPinScore-Windows-x64.zip
          archive: false

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "assets:assets" --add-data "config.example.ini:." --add-data "nvram-maps:nvram-maps" --icon "assets/icon.icns" --hidden-import="pynput.keyboard._darwin" --hidden-import="pynput.mouse._darwin" --name "VPinScore-macOS-arm64" main.py
          cd dist
          zip -qry VPinScore-macOS-arm64.zip VPinScore-macOS-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPinScore-macOS-arm64.zip
          path: dist/VPinScore-macOS-arm64.zip
          archive: false

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: VPinScore-Linux-x64.zip
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VPinScore-Windows-x64.zip
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VPinScore-macOS-arm64.zip
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VPinScore ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/VPinScore-Linux-x64.zip
            dist/VPinScore-Windows-x64.zip
            dist/VPinScore-macOS-arm64.zip
