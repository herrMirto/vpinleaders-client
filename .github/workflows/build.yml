name: Build VPinLeaders Client

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "batocera/README.md"
  workflow_dispatch:

jobs:
  build-batocera-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Batocera bundle
        run: |
          chmod +x batocera/build-bundle.sh
          ./batocera/build-bundle.sh

      - name: Upload Batocera artifact
        uses: actions/upload-artifact@v7
        with:
          name: vpinleaders-batocera-linux-x86_64.zip
          path: dist/vpinleaders-batocera-linux-x86_64.zip
          archive: false

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux desktop bundle
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name VPinLeaders-Linux-x64 \
            --add-data "assets:assets" \
            --add-data "config.example.ini:." \
            --add-data "nvram-maps:nvram-maps" \
            --hidden-import="pynput.keyboard._xorg" \
            --hidden-import="pynput.mouse._xorg" \
            main.py
          cp linux/vpinleaders-start.sh dist/vpinleaders-start.sh
          chmod +x dist/vpinleaders-start.sh
          cd dist
          zip -qry VPinLeaders-Linux-x64.zip VPinLeaders-Linux-x64 vpinleaders-start.sh

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPinLeaders-Linux-x64.zip
          path: dist/VPinLeaders-Linux-x64.zip
          archive: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --add-data "assets;assets" --add-data "config.example.ini;." --add-data "nvram-maps;nvram-maps" --icon "assets/icon.ico" --hidden-import="pynput.keyboard._win32" --hidden-import="pynput.mouse._win32" --name "VPinLeaders-Windows-x64" main.py
          Compress-Archive -Path dist/VPinLeaders-Windows-x64.exe -DestinationPath dist/VPinLeaders-Windows-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPinLeaders-Windows-x64.zip
          path: dist/VPinLeaders-Windows-x64.zip
          archive: false

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "assets:assets" --add-data "config.example.ini:." --add-data "nvram-maps:nvram-maps" --icon "assets/icon.icns" --hidden-import="pynput.keyboard._darwin" --hidden-import="pynput.mouse._darwin" --name "VPinLeaders-macOS-arm64" main.py
          cd dist
          zip -qry VPinLeaders-macOS-arm64.zip VPinLeaders-macOS-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPinLeaders-macOS-arm64.zip
          path: dist/VPinLeaders-macOS-arm64.zip
          archive: false
